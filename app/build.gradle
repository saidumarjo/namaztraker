plugins {
    id 'com.android.application'
}

def vc = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'tj.namoztraker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'tj.namoztraker.app'
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName "1.0." + vc
    }

    signingConfigs {
        release {
            storeFile file('namoztraker.jks')
            storePassword 'namoztraker'
            keyAlias 'namoztraker'
            keyPassword 'namoztraker'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
