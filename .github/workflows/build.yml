name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Namozkhon-TJ-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Namozkhon-TJ-APK
          path: Namozkhon-TJ-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Namozkhon-TJ-1.0.${{ github.run_number }}.apk \
            --title "НАМОЗХОН TJ 1.0.${{ github.run_number }}" \
            --notes "Файли APK-ро зер кунед ва насб намоед." --latest
