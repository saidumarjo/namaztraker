name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk NamozTraker-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NamozTraker-APK
          path: NamozTraker-*.apk
